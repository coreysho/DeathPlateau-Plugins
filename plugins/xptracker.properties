# XP tracker - events, per-session state, a hotkey, a sidebar page of its own.
#
# clientApi is 0 - "does not say" - ON PURPOSE, even though this plugin calls addPanel, which
# arrived in a later client than some players are running. It gets away with it because its
# startUp wraps the addPanel call in a catch of Throwable: on an older client the page is missing
# and everything else still works. Declaring clientApi=1 instead would keep those players from
# installing it at all, which is worse than a missing page.
#
# When clients at API 1 are everywhere, the right move is to drop that guard AND set clientApi=1
# in the same change - never one without the other.
name=XP tracker
description=Session experience and xp/hr, with a page of its own on the sidebar. F7 resets it.
author=Corey
version=1.1

repository=https://github.com/coreysho/DeathPlateau-Client.git
commit=48cd52f7e59f7bf4effa10455e4568e413d3474b
sourceDir=plugins/src
pluginClass=deathplateau.plugins.XpTrackerPlugin
